<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f48"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="YORU LOG"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon.svg"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>YORU LOG</title><style>*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#eee9df;color:#17202a}#bg{position:fixed;inset:0;z-index:0;background:center/cover no-repeat}.shade{position:fixed;inset:0;z-index:1;background:rgba(238,233,223,.28);pointer-events:none}.app{position:relative;z-index:2;max-width:680px;margin:auto;padding:24px 14px 60px}.hero{padding:12px 4px 18px}.ey{font-size:11px;font-weight:800;letter-spacing:.15em;color:#174d59;margin:0 0 5px}h1{font-size:34px;margin:0 0 8px}h2{font-size:20px;margin:0}.sub{margin:0;color:#59636a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.mini{background:rgba(255,253,248,.9);border:1px solid rgba(210,205,194,.9);border-radius:18px;box-shadow:0 8px 25px #0000000d;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}.mini{padding:14px}.mini span{font-size:12px;color:#687078;display:block}.mini b{font-size:25px}.card{padding:17px;margin-top:12px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}input,textarea,button{font:inherit}input[type=date],input[type=text],textarea{width:100%;border:1px solid #d9d4c9;background:#fff;border-radius:11px;padding:11px;margin-top:7px}label,legend{font-size:13px;font-weight:700}fieldset{border:0;padding:0;margin:16px 0}.choices{display:grid;gap:7px;margin-top:8px}.five{grid-template-columns:repeat(5,1fr)}.three{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:repeat(2,1fr)}.choices button{padding:10px;border:1px solid #d9d4c9;border-radius:11px;background:#fff}.choices button.on,.primary{background:#174d59;color:white;border-color:#174d59}.primary,.upload,.secondary{width:100%;padding:13px;border-radius:13px;font-weight:800}.primary{border:0}.upload{display:block;text-align:center;background:#174d59;color:#fff;margin-top:10px;cursor:pointer}.upload input{display:none}.secondary{background:#fff;border:1px solid #d9d4c9;margin-top:8px}.history .entry{border-top:1px solid #ddd8ce;padding:12px 0}.history .entry:first-child{border:0}.entry p{margin:5px 0;font-size:13px}.muted{color:#687078}.badge{float:right;font-size:11px;font-weight:800;background:#dbe9ec;color:#174d59;padding:4px 8px;border-radius:20px}.bad{background:#f1dfdc;color:#8d3c35}.msg{text-align:center;font-size:12px;color:#174d59;min-height:16px}.hide{display:none}.wallmsg{font-size:12px;color:#174d59;min-height:16px;margin:8px 0 0}</style></head><body><div id="bg"></div><div class="shade"></div><main class="app"><header class="hero"><p class="ey">CASTOR / NIGHT MEAL DIARY</p><h1>YORU LOG</h1><p class="sub">夜食をしなくて平気だった日の条件を見つける。</p></header><section class="grid"><div class="mini"><span>夜食なし連続</span><b id="streak">0日</b></div><div class="mini"><span>直近7記録 夜食なし</span><b id="rate">0/7</b></div></section><section class="card"><div class="head"><div><p class="ey">TODAY</p><h2>今日の記録</h2></div><input id="date" type="date" style="width:auto"></div><label>夜ごはん<textarea id="dinner" rows="3" placeholder="例：ご飯、豚肉、納豆、卵"></textarea></label><fieldset><legend>満足度</legend><div id="sat" class="choices five"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div></fieldset><fieldset><legend>夜食欲</legend><div id="urge" class="choices three"><button data-v="なし">なし</button><button data-v="少し">少し</button><button data-v="強い">強い</button></div></fieldset><fieldset><legend>夜食</legend><div id="snack" class="choices two"><button data-v="なし">なし</button><button data-v="あり">あり</button></div></fieldset><label id="detailWrap" class="hide">夜食の内容<input id="detail" type="text" placeholder="例：アイス、パン"></label><label>メモ<textarea id="memo" rows="2" placeholder="任意"></textarea></label><button id="save" class="primary">保存する</button><p id="msg" class="msg"></p></section><section class="card"><p class="ey">WALLPAPER</p><h2>背景写真</h2><p class="muted" style="font-size:13px">写真を選ぶとすぐ背景に反映し、この端末に保存します。</p><label class="upload">写真を選ぶ<input id="photo" type="file" accept="image/*"></label><button id="removeBg" class="secondary">背景を元に戻す</button><p id="wallmsg" class="wallmsg"></p></section><section class="card"><p class="ey">HISTORY</p><h2>最近の記録</h2><div id="history" class="history"></div></section></main><script>const K='yorulog-v1',S={sat:null,urge:null,snack:null},$=x=>document.getElementById(x);function today(){let d=new Date,d2=new Date(d-d.getTimezoneOffset()*60000);return d2.toISOString().slice(0,10)}$('date').value=today();function bind(id,key){$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S[key]=b.dataset.v;if(key==='snack')$('detailWrap').classList.toggle('hide',S.snack!=='あり')})}bind('sat','sat');bind('urge','urge');bind('snack','snack');const load=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}},store=x=>localStorage.setItem(K,JSON.stringify(x));$('save').onclick=()=>{if(!$('dinner').value.trim()||!S.sat||!S.urge||!S.snack){$('msg').textContent='未入力の項目があります';return}let a=load(),e={date:$('date').value,dinner:$('dinner').value.trim(),sat:+S.sat,urge:S.urge,snack:S.snack,detail:$('detail').value.trim(),memo:$('memo').value.trim()};a=a.filter(x=>x.date!==e.date);a.push(e);a.sort((a,b)=>b.date.localeCompare(a.date));store(a);$('msg').textContent='保存しました ✓';render()};function render(){let a=load(),h=$('history');h.innerHTML=a.length?a.slice(0,14).map(e=>`<div class="entry"><span class="badge ${e.snack==='あり'?'bad':''}">夜食 ${e.snack}</span><b>${e.date}</b><p>${esc(e.dinner)}</p><p class="muted">満足度 ${e.sat}/5 ・ 夜食欲 ${e.urge}${e.detail?' ・ '+esc(e.detail):''}</p>${e.memo?`<p class="muted">${esc(e.memo)}</p>`:''}</div>`).join(''):'<p class="muted">まだ記録がありません。</p>';let recent=a.slice(0,7);$('rate').textContent=recent.filter(e=>e.snack==='なし').length+'/'+(recent.length||7);let st=0;for(let e of a){if(e.snack==='なし')st++;else break}$('streak').textContent=st+'日'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let currentURL=null;function showBlob(blob){if(currentURL)URL.revokeObjectURL(currentURL);currentURL=URL.createObjectURL(blob);$('bg').style.backgroundImage=`url("${currentURL}")`;}function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('yorulog-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('settings');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function saveBg(blob){let db=await openDB();return new Promise((resolve,reject)=>{let t=db.transaction('settings','readwrite');t.objectStore('settings').put(blob,'background');t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}async function loadBg(){try{let db=await openDB();let blob=await new Promise((resolve,reject)=>{let t=db.transaction('settings','readonly'),r=t.objectStore('settings').get('background');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(blob)showBlob(blob)}catch(e){}}async function deleteBg(){try{let db=await openDB();await new Promise((resolve,reject)=>{let t=db.transaction('settings','readwrite');t.objectStore('settings').delete('background');t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}catch(e){}}$('photo').addEventListener('change',async e=>{let file=e.target.files&&e.target.files[0];if(!file)return;showBlob(file);$('wallmsg').textContent='背景を変更しました ✓';try{await saveBg(file)}catch(err){$('wallmsg').textContent='背景は変更できました。保存だけできませんでした。'}});$('removeBg').onclick=async()=>{if(currentURL)URL.revokeObjectURL(currentURL);currentURL=null;$('bg').style.backgroundImage='none';await deleteBg();$('wallmsg').textContent='背景を元に戻しました。'};loadBg();render();</script></body></html>
